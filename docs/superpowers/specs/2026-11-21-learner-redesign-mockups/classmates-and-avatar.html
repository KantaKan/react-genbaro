<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Classmates</title>
<style>
:root{
  --bg:#f7f7f8; --card:#fff; --ink:#18181b; --ink2:#52525b; --ink3:#a1a1aa; --hair:rgba(24,24,27,.07);
  --indigo:#6366f1; --indigo-d:#4338ca; --indigo-s:#eef2ff;
  --ease:cubic-bezier(.32,.72,0,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --shadow:0 0 0 1px var(--hair),0 1px 2px rgba(24,24,27,.04),0 8px 24px -16px rgba(24,24,27,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:"Geist","Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Noto Sans Thai",system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-size:14px;letter-spacing:-.006em}
button,input,textarea{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer}
svg.i{width:18px;height:18px;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:flex;min-height:100vh}
.sb{width:248px;flex:none;background:#fff;border-right:1px solid var(--hair);padding:16px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(140deg,#18181b,#3f3f46);color:#fff;display:grid;place-items:center;font-weight:700}
.lbl{font-size:11.5px;color:var(--ink3);font-weight:500;padding:14px 10px 6px}
.nv{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--ink2);font-weight:500}
.nv.on{background:#f4f4f5;color:var(--ink)}
.main{flex:1;min-width:0}
.top{height:60px;display:flex;align-items:center;padding:0 28px;border-bottom:1px solid var(--hair);background:rgba(247,247,248,.82);backdrop-filter:blur(12px);position:sticky;top:0;z-index:5}
.top{gap:14px;height:64px}
.tt{display:flex;align-items:baseline;gap:10px;min-width:0}
.tt b{font-size:17px;font-weight:650;letter-spacing:-.02em;white-space:nowrap}
.tt span{color:var(--ink3);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ta{margin-left:auto;display:flex;gap:8px;align-items:center}
.content{padding:28px;max-width:1240px}

/* avatar */
.ava{border-radius:50%;overflow:hidden;flex:none;display:grid;place-items:center;font-weight:650;position:relative}
.ava img{width:100%;height:100%;display:block}
.ava span{position:absolute;inset:0;display:grid;place-items:center}

/* header */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph h1{font-size:28px;font-weight:650;letter-spacing:-.03em}
.ph p{color:var(--ink2);margin-top:4px}

/* group hero */
.hero{margin-top:22px;border-radius:24px;padding:22px;background:
  radial-gradient(70% 140% at 0% 0%,#e0e7ff,transparent 60%),radial-gradient(60% 140% at 100% 100%,#fce7f3,transparent 60%),#fff;box-shadow:var(--shadow)}
.hero .hh{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hero .hh b{font-size:17px;font-weight:650;letter-spacing:-.02em}
.hero .hh small{display:block;color:var(--ink2);font-size:12.5px;margin-top:2px}
.mates{display:flex;gap:12px;margin-top:18px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none}
.mate{flex:none;width:150px;border-radius:18px;background:rgba(255,255,255,.75);backdrop-filter:blur(6px);box-shadow:0 0 0 1px var(--hair);padding:16px 12px 14px;text-align:center;transition:transform .45s var(--ease),box-shadow .3s}
.mate:hover{transform:translateY(-4px);box-shadow:0 0 0 1px var(--hair),0 16px 30px -18px rgba(24,24,27,.35)}
.mate .ava{width:68px;height:68px;margin:0 auto}
.mate b{display:block;margin-top:10px;font-weight:600;font-size:14.5px}
.mate small{display:block;color:var(--ink3);font-size:12px}
.mate .you{font-size:10.5px;font-weight:650;color:var(--indigo-d);background:var(--indigo-s);border-radius:99px;padding:1px 7px;display:inline-block;margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:8px 14px;font-weight:550;font-size:13px;transition:transform .3s var(--ease),box-shadow .3s,background .3s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.dark{background:var(--ink);color:#fff}
.btn.ghost{background:#fff;box-shadow:0 0 0 1px var(--hair)}
.btn.ghost:hover{box-shadow:0 0 0 1px rgba(24,24,27,.2)}

/* toolbar */
.bar{display:flex;gap:10px;align-items:center;margin:30px 0 16px;flex-wrap:wrap}
.bar h2{font-size:17px;font-weight:650;letter-spacing:-.02em;margin-right:6px}
.search{display:flex;align-items:center;gap:8px;background:#fff;box-shadow:0 0 0 1px var(--hair);border-radius:12px;padding:8px 12px;color:var(--ink3);width:260px;transition:box-shadow .2s}
.search:focus-within{box-shadow:0 0 0 1.5px var(--ink)}
.search input{outline:none;flex:1;color:var(--ink);min-width:0}
.search kbd{font-size:11px;border-radius:5px;padding:0 5px;box-shadow:0 0 0 1px var(--hair);font-family:inherit}
.groups{display:flex;gap:4px;background:#fff;box-shadow:0 0 0 1px var(--hair);border-radius:12px;padding:3px;overflow-x:auto;scrollbar-width:none}
.groups button{padding:5px 10px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--ink2);transition:all .25s var(--ease)}
.groups button.on{background:var(--ink);color:#fff}
.seg{display:inline-flex;background:#fff;box-shadow:0 0 0 1px var(--hair);border-radius:12px;padding:3px}
.seg button{width:32px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--ink3)}
.seg button.on{background:#f4f4f5;color:var(--ink)}
.sort{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.sort button{font-weight:600;color:var(--ink)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pc{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:transform .45s var(--ease),box-shadow .3s;animation:up .55s var(--ease) both;text-align:left}
.pc:hover{transform:translateY(-3px);box-shadow:0 0 0 1px var(--hair),0 18px 34px -20px rgba(24,24,27,.3)}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pc .r1{display:flex;gap:12px;align-items:center}
.pc .ava{width:52px;height:52px}
.pc .nm b{font-size:15px;font-weight:600;display:block}
.pc .nm small{color:var(--ink3);font-size:12.5px}
.pc .gp{margin-left:auto;align-self:flex-start;font-size:11.5px;font-weight:650;color:var(--ink2);background:#f4f4f5;border-radius:8px;padding:2px 7px}
.pc .bio{color:var(--ink2);font-size:13px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:39px}
.pc .ft{display:flex;align-items:center;gap:6px;margin-top:auto}
.tag{font-size:11.5px;font-weight:550;border-radius:7px;padding:2px 8px;background:#fafafa;box-shadow:0 0 0 1px var(--hair);color:var(--ink2)}
.minis{display:flex;margin-left:auto}
.mini{width:22px;height:22px;border-radius:50%;box-shadow:0 0 0 2px #fff;margin-left:-6px;display:grid;place-items:center}
.mini svg{width:11px;height:11px;stroke:#fff;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.hl{background:#fef08a;border-radius:3px;padding:0 1px}

/* list */
.list{background:#fff;border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.lrow{display:grid;grid-template-columns:44px 1.3fr 70px 2fr 120px 24px;gap:14px;align-items:center;padding:12px 18px;border-top:1px solid var(--hair);cursor:pointer;transition:background .2s}
.lrow:first-child{border-top:0}
.lrow:hover{background:#fafafa}
.lrow .ava{width:40px;height:40px}
.lhead{font-size:11.5px;color:var(--ink3);font-weight:600;background:#fafafa;cursor:default}
.lhead:hover{background:#fafafa}
.empty{padding:48px;text-align:center;color:var(--ink3)}

/* peek */
.scrim{position:fixed;inset:0;background:rgba(24,24,27,.22);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .4s var(--ease);z-index:30}
.peek{position:fixed;top:12px;right:12px;bottom:12px;width:440px;max-width:calc(100% - 24px);background:#fff;border-radius:24px;box-shadow:0 30px 80px -20px rgba(0,0,0,.35);transform:translateX(110%);transition:transform .55s var(--ease);z-index:31;display:flex;flex-direction:column;overflow:hidden}
.open .scrim{opacity:1;pointer-events:auto}.open .peek{transform:none}
.pk-cover{height:110px;margin:0 -22px;position:relative}
.pk-close{position:absolute;top:12px;right:12px;z-index:3;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.85);display:grid;place-items:center;backdrop-filter:blur(6px)}
.pk-body{padding:0 22px 22px;overflow:auto;flex:1}
.pk-top{display:flex;align-items:flex-end;gap:14px;margin-top:-38px;position:relative;z-index:1}
.pk-top .ava{width:84px;height:84px;box-shadow:0 0 0 4px #fff}
.pk-top h3{font-size:21px;font-weight:650;letter-spacing:-.025em}
.pk-top small{color:var(--ink2)}
.soc{display:flex;gap:6px;margin-top:14px}
.soc a{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:550;border-radius:10px;padding:6px 10px;box-shadow:0 0 0 1px var(--hair)}
.sec{margin-top:22px}
.sec h4{font-size:12px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.medals{display:flex;gap:10px;flex-wrap:wrap}
.medal{display:flex;flex-direction:column;align-items:center;gap:4px;width:74px;text-align:center;font-size:11px;font-weight:600;line-height:1.2}
.medal svg{width:52px;height:52px;filter:drop-shadow(0 6px 8px rgba(24,24,27,.14))}
.rec{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--hair)}
.rec:first-child{border-top:0}
.rec .ava{width:30px;height:30px;font-size:11px}
.rec q{display:block;font-size:13px;line-height:1.5}
.rec small{color:var(--ink3);font-size:11.5px}
.compose{margin-top:12px;border-radius:16px;box-shadow:0 0 0 1px var(--hair);padding:12px;transition:box-shadow .2s}
.compose:focus-within{box-shadow:0 0 0 1.5px var(--ink)}
.compose textarea{width:100%;resize:none;height:60px;outline:none;font-size:13.5px}
.compose .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.qk{font-size:12px;border-radius:99px;padding:4px 10px;background:#fafafa;box-shadow:0 0 0 1px var(--hair)}
.qk:hover{background:#f4f4f5}
.private{display:flex;gap:10px;align-items:flex-start;margin-top:22px;padding:12px 14px;border-radius:14px;background:#fafafa;color:var(--ink2);font-size:12.5px;line-height:1.5}
.mate{position:relative}
.editdot{position:absolute;top:58px;left:calc(50% + 16px);width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 3px #fff}
.editdot svg{width:12px;height:12px;stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.mwrap{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .35s var(--ease)}
.mwrap.open{opacity:1;pointer-events:auto}
.mwrap .bd{position:absolute;inset:0;background:rgba(24,24,27,.35);backdrop-filter:blur(4px)}
.modal{position:relative;width:880px;max-width:100%;height:600px;max-height:calc(100vh - 32px);background:#fff;border-radius:26px;box-shadow:0 40px 100px -30px rgba(0,0,0,.5);display:grid;grid-template-columns:320px 1fr;overflow:hidden;transform:translateY(16px) scale(.98);transition:transform .5s var(--spring)}
.mwrap.open .modal{transform:none}
.prev{padding:24px;display:flex;flex-direction:column;align-items:center;gap:14px;background:linear-gradient(180deg,#fafafa,#f4f4f5);border-right:1px solid var(--hair)}
.prev h3{font-size:17px;font-weight:650;letter-spacing:-.02em;align-self:flex-start}
.prev .big{width:230px;height:230px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 6px #fff,0 24px 44px -20px rgba(0,0,0,.35);position:relative;transition:background .4s}
.prev .big img{position:absolute;inset:0;width:100%;height:100%;transition:opacity .25s}
.prev .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.styles{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.sty{width:46px;height:46px;border-radius:14px;background:#fff;box-shadow:0 0 0 1px var(--hair);overflow:hidden;transition:box-shadow .2s,transform .3s var(--ease)}
.sty:hover{transform:translateY(-2px)}
.sty.on{box-shadow:0 0 0 2px var(--ink)}
.sty img{width:100%;height:100%}
.ed{display:flex;flex-direction:column;min-width:0}
.ed .tabs{display:flex;gap:4px;padding:16px 18px 0;overflow-x:auto;scrollbar-width:none;flex:none}
.ed .tabs button{padding:8px 12px;border-radius:10px;font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap}
.ed .tabs button.on{background:#f4f4f5;color:var(--ink)}
.ed .pane{flex:1;overflow:auto;padding:16px 18px}
.ed h5{font-size:12px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin:6px 0 10px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin-bottom:16px}
.op{aspect-ratio:1;border-radius:16px;background:#fafafa;box-shadow:0 0 0 1px var(--hair);overflow:hidden;position:relative;transition:box-shadow .2s,transform .3s var(--ease)}
.op:hover{transform:translateY(-2px)}
.op.on{box-shadow:0 0 0 2px var(--ink);background:#fff}
.op img{width:100%;height:100%}
.op .none{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:var(--ink3);font-weight:600}
.op.lk{opacity:.55}
.op .lkp{position:absolute;left:4px;right:4px;bottom:4px;font-size:9.5px;font-weight:700;background:var(--ink);color:#fff;border-radius:99px;padding:1px 4px;text-align:center}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.swc{width:42px;height:42px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);transition:transform .3s var(--spring)}
.swc:hover{transform:scale(1.1)}
.swc.on{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--ink)}
.ed .ft{flex:none;display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:14px 18px;border-top:1px solid var(--hair)}
@media (max-width:820px){.modal{grid-template-columns:1fr;height:auto}.prev{border-right:0;border-bottom:1px solid var(--hair)}.prev .big{width:150px;height:150px}.ed .pane{max-height:40vh}}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,24px);opacity:0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;transition:all .5s var(--ease);z-index:40}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:980px){.sb{display:none}.content{padding:18px 16px}.search{width:100%}.lrow{grid-template-columns:40px 1fr 60px 24px}.lrow .hide-sm{display:none}}
</style>
</head>
<body>
<div class="app" id="app">
<aside class="sb">
  <div class="brand"><div class="logo">B</div><div><b style="font-size:14px;font-weight:600;display:block">Baro</b><small style="font-size:12px;color:var(--ink3)">JSD13 · Learner</small></div></div>
  <div class="lbl">Learning</div>
  <div class="nv"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>Today</div>
  <div class="nv"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>Attendance</div>
  <div class="nv"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>My profile</div>
  <div class="lbl">Community</div>
  <div class="nv on"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.5a5 5 0 0 1 4.5 5"/></svg>Classmates</div>
  <div class="nv"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-5A8 8 0 1 1 21 12z"/></svg>Talk Board</div>
</aside>

<main class="main">
  <div class="top"><div class="tt"><b>Classmates</b><span id="sub"></span></div><div class="ta"><label class="search" style="width:240px"><svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Name, nickname or skill…"><kbd>/</kbd></label></div></div>
  <div class="content">
    <section class="hero" style="margin-top:0">
      <div class="hh"><div><b>Your GenMate group · F</b><small>The people you'll see most. Say hi, pair up, cheer each other on.</small></div><button class="btn ghost"><svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-5A8 8 0 1 1 21 12z"/></svg>Open group chat</button></div>
      <div class="mates" id="mates"></div>
    </section>

    <div class="bar">
      <h2>Everyone</h2>
      <div class="groups" id="groups"></div>
      <span style="flex:1"></span>
      <div class="sort">Sort <button id="sortBtn">A–Z</button></div>
      <div class="seg"><button class="on" data-v="grid" title="Grid"><svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg></button><button data-v="list" title="List"><svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></button></div>
    </div>
    <div id="out"></div>
  </div>
</main>
</div>

<div id="pkWrap"><div class="scrim" id="scrim"></div><aside class="peek" id="peek"></aside></div>
<div class="mwrap" id="mw"><div class="bd" id="mbd"></div><div class="modal">
  <div class="prev"><h3>Your avatar</h3><div class="big" id="bigPrev"><img id="bigImg" alt=""></div>
    <div class="row"><button class="btn ghost" id="shuffleA"><svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>Shuffle</button><button class="btn ghost" id="uploadA"><svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>Use a photo</button></div>
    <div style="font-size:12px;color:var(--ink3);margin-top:6px">Style</div><div class="styles" id="styles"></div>
  </div>
  <div class="ed"><div class="tabs" id="etabs"></div><div class="pane" id="pane"></div>
    <div class="ft"><span style="flex:1;font-size:12px;color:var(--ink3)" id="edNote"></span><button class="btn ghost" id="cancelA">Cancel</button><button class="btn dark" id="saveA">Save avatar</button></div></div>
</div></div>
<div class="toast" id="toast"></div>

<script type="module">
import { createAvatar } from 'https://cdn.jsdelivr.net/npm/@dicebear/core@9.2.2/+esm';
import { notionists, lorelei, adventurer, funEmoji, pixelArt, thumbs } from 'https://cdn.jsdelivr.net/npm/@dicebear/collection@9.2.2/+esm';
const STY={notionists,lorelei,adventurer,'fun-emoji':funEmoji,'pixel-art':pixelArt,thumbs};
const _cache=new Map();
function gen(style,opts){const k=style+JSON.stringify(opts);if(_cache.has(k))return _cache.get(k);const u=createAvatar(STY[style],opts).toDataUri();_cache.set(k,u);return u}

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2200)}

const SKIP=new Set(['backgroundColor','backgroundType','base','shape','seed','flip','rotate','scale','radius','size','translateX','translateY','clip','randomizeIds','backgroundRotation']);
const EXTRA_COLORS=['000000','3f3f46','71717a','f4f4f5','ffffff','7c2d12','b45309','f59e0b','16a34a','0ea5e9','6366f1','db2777','e11d48'];
const LOCK={saturn:15,galaxy:30};
/* turn a style's schema into tabs: [{tab, rows:[{key,label,kind:'part'|'color',values,optional}]}] */
function tabsFor(st){const sc=schemaOf(st);const rows=[];
  for(const [k,v] of Object.entries(sc)){if(SKIP.has(k)||k.endsWith('Probability'))continue;const it=v.items||{};
    if(it.enum&&it.enum.length>1||(it.enum&&sc[k+'Probability']))rows.push({key:k,label:LABEL[k]||k,kind:'part',values:[...it.enum].sort(),optional:!!sc[k+'Probability']});
    else if(k.endsWith('Color')){const d=Array.isArray(v.default)?v.default:[];const vals=[...new Set([...d,...(d.length<4?EXTRA_COLORS:[])])];if(vals.length>1)rows.push({key:k,label:LABEL[k]||k,kind:'color',values:vals})}}
  const out=[];const used=new Set();
  for(const [t,keys] of Object.entries(GROUP)){const r=keys.map(k=>rows.find(x=>x.key===k)).filter(Boolean);r.forEach(x=>used.add(x.key));if(r.length)out.push({tab:t,rows:r})}
  const rest=rows.filter(x=>!used.has(x.key));if(rest.length)out.push({tab:'More',rows:rest});
  out.push({tab:'Background',rows:null});return out}

    const vals=r.optional?[null,...r.values]:r.values;
    return `<h5>${r.label}${r.values.length>1?` · ${r.values.length}`:''}</h5><div class="opts">${vals.map(v=>{const lk=v&&LOCK[v]&&STREAK<LOCK[v];
      return `<button class="op ${sel[r.key]===v?'on':''} ${lk?'lk':''}" data-k="${r.key}" data-v="${v??''}" ${lk?`data-lock="${LOCK[v]}"`:''}>${v===null?'<span class="none">None</span>':`<img src="${aurl(draft,{parts:{[r.key]:v},_nobg:1})}">`}${lk?`<span class="lkp">${LOCK[v]}-day streak</span>`:''}</button>`}).join('')}</div>`}).join('');
  $$('#pane .op').forEach(b=>b.onclick=()=>{if(b.dataset.lock){toast(`Unlocks at a ${b.dataset.lock}-day on-time streak (you're at ${STREAK})`);return}
    cur()[b.dataset.k]=b.dataset.v||null;$$(`#pane .op[data-k="${b.dataset.k}"]`).forEach(x=>x.classList.toggle('on',x===b));paintPrev();refreshThumbs()});
  $$('#pane .swc[data-k]').forEach(b=>b.onclick=()=>{cur()[b.dataset.k]=b.dataset.c;paintEd()});
}
/* after picking one part, re-render the other thumbnails so they show the new combo */
function refreshThumbs(){$$('#pane .op').forEach(b=>{const img=b.querySelector('img');if(img)img.src=aurl(draft,{parts:{[b.dataset.k]:b.dataset.v||null},_nobg:1})});$$('#styles .sty img').forEach((im,i)=>im.src=aurl(draft,{style:STYLES[i][0],_nobg:1}))}
const pk2=a=>a[Math.floor(Math.random()*a.length)];
$('#shuffleA').onclick=()=>{draft.seed=Math.random().toString(36).slice(2,8);draft.by[draft.style]={};
  draft.bg=pk2(BGS.slice(0,8));const b=$('#bigPrev');b.animate([{transform:'rotate(0)'},{transform:'rotate(-8deg) scale(.96)'},{transform:'rotate(6deg)'},{transform:'none'}],{duration:450});paintEd()};
$('#uploadA').onclick=()=>toast('In the real app this opens your photos. For now, try the avatar builder');
$('#saveA').onclick=()=>{ME.cfg=JSON.parse(JSON.stringify(draft));try{localStorage.setItem('baro-avatar2',JSON.stringify(ME.cfg))}catch(e){}
  closeEd();$('#mates').innerHTML=mates.map(p=>`<button class="mate" data-no="${p.no}">${ava(p,68)}<b>${p.th}</b><small>${p.en} · #${String(p.no).padStart(2,'0')}</small>${p===ME?'<span class="editdot" data-edit="1"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></span><span class="you">You · edit</span>':`<small style="margin-top:6px;color:var(--ink2)">${p.skills[0]}</small>`}</button>`).join('');
  toast('Avatar saved. Everyone in JSD13 will see the new you')};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeEd()});
const _q=new URLSearchParams(location.search);if(_q.get('edit')){openEditor();if(_q.get('style')){draft.style=_q.get('style');tab=tabsFor(draft.style)[0].tab;paintEd()}}
if(new URLSearchParams(location.search).get('peek'))openPeek(+new URLSearchParams(location.search).get('peek'));
</script>
